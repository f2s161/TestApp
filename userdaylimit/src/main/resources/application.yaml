server:
  port: 8082
spring:
  liquibase:
    default-schema: userdaylimit
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=${spring.liquibase.default-schema}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  day-limit: 10000
  products-service-url: http://localhost:8080

